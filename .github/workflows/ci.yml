name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run pytest with coverage
        run: pytest -v --cov=llm_eval_harness --cov-report=term-missing

  eval-gate:
    name: Evaluation gate (offline suite vs committed baseline)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Uses scripted offline clients: no API keys or network needed. The step exits
      # non-zero on any threshold violation or regression vs examples/ci/baseline.json,
      # which blocks the pull request / promotion.
      - name: Run evaluation suite through the gate
        run: |
          llm-eval run \
            --suite examples/ci/suite.yaml \
            --baseline examples/ci/baseline.json \
            --thresholds examples/ci/thresholds.yaml \
            --pricing examples/ci/pricing.yaml \
            --report eval-report.md \
            --json-out eval-report.json

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f eval-report.md ]; then cat eval-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval-report.md
            eval-report.json
          if-no-files-found: ignore
